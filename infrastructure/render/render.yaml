services:
  # ---------------------------------------------------------------------------
  # Backend API Service (Django REST Framework)
  # ---------------------------------------------------------------------------
  - type: web
    name: personal-planner-api
    runtime: python
    rootDir: apps/api
    buildCommand: uv sync --frozen && uv run python manage.py collectstatic --no-input
    preDeployCommand: uv run python manage.py migrate --no-input
    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false # Connect to Supabase PostgreSQL (Session pooler port 5432 recommended)
      - key: DATABASE_CONNECT_TIMEOUT
        value: "10"
      - key: DATABASE_CONN_MAX_AGE
        value: "600"
      - key: OWNER_USERNAME
        sync: false # Set to designated owner username
      - key: OWNER_EMAIL
        sync: false # Set to designated owner email
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend Web Service (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: personal-planner-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: INTERNAL_API_URL
        sync: false # Set to internal backend URL (e.g. http://personal-planner-api:10000 or public API URL for rewrites)
      - key: NEXT_PUBLIC_API_URL
        sync: false # Optional: Set if direct public API routing is used instead of rewrites
